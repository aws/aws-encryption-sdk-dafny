# This workflow performs benchmark testing in Java.
name: Performance Benchmarks Go

on:
  workflow_call:

jobs:
  testPython:
    strategy:
      fail-fast: false
      matrix:
        benchmark-dir: [esdk-performance-testing]
        python-version: ["3.11", "3.13"]
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Init Submodules
        shell: bash
        run: |
          git submodule update --init libraries
          git submodule update --init --recursive mpl

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: GoTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Setup Python ${{ matrix.python-version }} for running tests
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Run Performance Benchmarks - Quick Mode
        shell: bash
        working-directory: ./${{matrix.benchmark-dir}}/benchmarks/python
        run: |
          pip install -r requirements.txt
          python esdk_benchmark.py --quick

      - name: Parse and Format Logs
        working-directory: ./${{matrix.benchmark-dir}}/results/raw-data/
        run: |
          LOG_FILE="python_results.json"
          UPLOAD_FILE="cloudwatch_logs.json"
          TIMESTAMP=$(date +%s%3N)
          jq -c --arg ts "$(date +%s)000" '[.results[] as $result | .metadata as $meta | {timestamp: ($ts | tonumber), message: ({metadata: $meta, result: $result} | tostring)}]' $LOG_FILE > $UPLOAD_FILE

      - name: Upload logs to CloudWatch
        working-directory: ./${{matrix.benchmark-dir}}/results/raw-data/
        run: |
          LOG_FILE="cloudwatch_logs.json"
          LOG_GROUP="aws-esdk-performance-benchmarks"
          LOG_STREAM="python/${{matrix.python-version}}/quick_benchmarks/${{ github.workflow }}"

          # Create log stream (ignore if exists)
          aws logs create-log-stream \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" 2>/dev/null || true

          aws logs put-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" \
            --log-events file://$LOG_FILE

      # Dimensioned metrics (namespace EsdkPerformanceBenchmarks) for the
      # faceted dashboard. Additive to the log upload above.
      - name: Publish CloudWatch metrics
        working-directory: ./${{matrix.benchmark-dir}}/results/raw-data/
        run: |
          NAMESPACE="EsdkPerformanceBenchmarks"
          jq -c --arg keyring "raw-aes" --arg os "${{ matrix.os }}" '
            [ .results[] as $r
              | [ {n: "P50Latency",      v: ($r.p50_latency // $r.p50_latency_ms),           u: "Milliseconds"},
                  {n: "P95Latency",      v: ($r.p95_latency // $r.p95_latency_ms),           u: "Milliseconds"},
                  {n: "P99Latency",      v: ($r.p99_latency // $r.p99_latency_ms),           u: "Milliseconds"},
                  {n: "OpsPerSecond",    v: ($r.ops_per_second // $r.operations_per_second), u: "Count/Second"},
                  {n: "PeakMemoryRssMb", v: $r.peak_memory_mb,                               u: "Megabytes"} ][]
              | select(.v > 0)
              | {MetricName: .n, Value: .v, Unit: .u,
                 Dimensions: [ {Name: "Language",    Value: $r.language},
                               {Name: "Keyring",     Value: $keyring},
                               {Name: "TestType",    Value: $r.test_name},
                               {Name: "DataSize",    Value: ($r.data_size | tostring)},
                               {Name: "OS",          Value: $os},
                               {Name: "Concurrency", Value: ($r.concurrency | tostring)} ]} ]' \
            python_results.json > metric_data.json
          if [ "$(jq length metric_data.json)" -gt 0 ]; then
            aws cloudwatch put-metric-data --namespace "$NAMESPACE" \
              --metric-data file://metric_data.json
          fi
